name: CI/CD - SCDonationProcessor to EKS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: solidarity-connection-eks
  NAMESPACE: solidarity-connection-namespace
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore ./SCDonationProcessor.sln --configuration Release --verbosity detailed | tee restore.log

      - name: Diagnóstico completo do NuGet
        run: |
          echo "=== Variáveis de ambiente NUGET_* ==="
          env | grep -i nuget || echo "(nenhuma variável NUGET_* definida)"

          echo "=== Pastas de cache configuradas pelo NuGet ==="
          dotnet nuget locals all --list

          echo "=== obj/ do projeto Infrastructure existe? ==="
          ls -la ./SCDonationProcessor.Infrastructure/obj/ 2>/dev/null || echo "pasta obj NÃO existe"

          echo "=== project.assets.json existe? ==="
          test -f ./SCDonationProcessor.Infrastructure/obj/project.assets.json && echo "existe" || echo "NÃO existe"

          echo "=== Quantos pacotes o restore.log diz ter restaurado? ==="
          grep -ci "restored " restore.log || echo "0 linhas 'Restored' encontradas"

          echo "=== Linhas do restore.log mencionando RabbitMQ ==="
          grep -i "rabbitmq" restore.log || echo "Nenhuma menção a RabbitMQ no restore.log"

      - name: Build
        run: dotnet build ./SCDonationProcessor.sln --configuration Release --no-restore

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./SCDonationProcessor.EventProcessor/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sc-donation-processor-image:latest
            ${{ secrets.DOCKER_USERNAME }}/sc-donation-processor-image:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.32.0"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply manifests
        run: |
          kubectl apply -f namespace.yaml
          kubectl apply -f configmap.yaml
          kubectl apply -f service.yaml
          kubectl apply -f deployment.yaml

      - name: Create or update Kubernetes secret
        run: |
          kubectl create secret generic sc-donation-processor-secret \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=RabbitMQ__Username="${{ secrets.RABBITMQ_USERNAME }}" \
            --from-literal=RabbitMQ__Password="${{ secrets.RABBITMQ_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update deployment image
        run: |
          kubectl set image deployment/sc-donation-processor \
            sc-donation-processor=${{ secrets.DOCKER_USERNAME }}/sc-donation-processor-image:${{ env.IMAGE_TAG }} \
            -n ${{ env.NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/sc-donation-processor \
            -n ${{ env.NAMESPACE }} \
            --timeout=180s

      - name: Show status
        if: always()
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide || true
          kubectl get svc -n ${{ env.NAMESPACE }} || true
          kubectl get deployment sc-donation-processor -n ${{ env.NAMESPACE }} -o wide || true
