apiVersion: v1
kind: Service
metadata:
  name: sc-donation-processor-metrics
  namespace: solidarity-connection-namespace
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "9091"
spec:
  type: ClusterIP
  selector:
    app: sc-donation-processor
  ports:
    - name: metrics
      protocol: TCP
      port: 9091
      targetPort: 9091
